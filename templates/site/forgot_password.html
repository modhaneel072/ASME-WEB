{% extends "site/base.html" %}

{% block content %}
<div class="auth-panel">
  <div class="panel">
    <div style="text-align: center; margin-bottom: var(--sp-6);">
      <h3>Forgot Password</h3>
      <p style="color: var(--muted); font-size: var(--text-sm); margin-top: var(--sp-2);">
        Enter your email and we'll generate a reset link.
      </p>
    </div>
    <form method="post" class="form-stack">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="you@uiowa.edu" autocomplete="email" />
      </div>
      <button type="submit" style="width: 100%;">Generate Reset Link</button>
    </form>
    <div class="auth-links" style="text-align: center; margin-top: var(--sp-5);">
      <p><a href="/login">&larr; Back to login</a></p>
    </div>
  </div>
</div>
{% endblock %}
