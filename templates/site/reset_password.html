{% extends "site/base.html" %}

{% block content %}
<div class="auth-panel">
  <div class="panel">
    <div style="text-align: center; margin-bottom: var(--sp-6);">
      <h3>Reset Password</h3>
      <p style="color: var(--muted); font-size: var(--text-sm); margin-top: var(--sp-2);">
        Choose a new password for your account.
      </p>
    </div>
    <form method="post" class="form-stack">
      <div class="form-group">
        <label for="password">New Password</label>
        <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password" />
      </div>
      <button type="submit" style="width: 100%;">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
