{% extends "site/base.html" %}

{% block content %}
<div class="auth-panel">
  <div class="panel">
    <div style="text-align: center; margin-bottom: var(--sp-6);">
      <img src="{{ url_for('static', filename='asme_logo.png') }}" alt="ASME" style="width: 48px; height: 48px; margin: 0 auto var(--sp-4); object-fit: contain;" />
      <h3>Member Login</h3>
      <p style="color: var(--muted); font-size: var(--text-sm); margin-top: var(--sp-2);">
        Sign in to access the ASME member portal.
      </p>
    </div>
    <form method="post" class="form-stack">
      <input type="hidden" name="next" value="{{ next_url or '' }}" />
      <div class="form-group">
        <label for="identifier">Email or Username</label>
        <input id="identifier" name="identifier" type="text" required placeholder="you@uiowa.edu" autocomplete="username" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required autocomplete="current-password" />
      </div>
      <button type="submit" style="width: 100%;">Sign In</button>
    </form>
    <div class="auth-links" style="text-align: center; margin-top: var(--sp-5);">
      <p><a href="/forgot-password">Forgot password?</a></p>
      <p style="margin-top: var(--sp-2);">Don't have an account? <a href="/signup">Sign up</a></p>
      <p style="margin-top: var(--sp-3); padding-top: var(--sp-3); border-top: 1px solid var(--line-soft);">
        <a href="/admin-login" style="color: var(--muted);">Admin login &rarr;</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
